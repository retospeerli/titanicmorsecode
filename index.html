<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titanic Funkprüfung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">

    <section id="languageScreen" class="screen active">
      <div class="paper centerPaper">
        <h1>R.M.S. TITANIC</h1>
        <p>Wähle die Sprache der Auftragskarten.</p>
        <div class="buttonRow">
          <button onclick="startApp('de')">Deutsch</button>
          <button onclick="startApp('en')">English</button>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="layout">

        <aside class="paper taskCard">
          <div class="smallTitle" id="taskLabel">AUFTRAG</div>
          <div id="taskText"></div>
        </aside>

        <section class="radioArea">
          <video id="videoPlayer" class="videoBox" playsinline controls></video>

          <div class="morseStrip">
            <div id="incomingMorse"></div>
          </div>

          <div class="inputPanel paper">
            <div class="smallTitle" id="inputLabel">MORSE-EINGABE</div>
            <p id="instruction"></p>

            <textarea id="morseInput" autocomplete="off" spellcheck="false"></textarea>

            <div class="buttonRow">
              <button id="checkButton">Funkspruch senden</button>
              <button id="repeatButton">Antwort nochmals hören</button>
            </div>

            <div id="feedback"></div>
          </div>
        </section>

        <aside class="paper infoCard">
          <div class="smallTitle">RUFZEICHEN</div>
          <p><b>MGY</b> = R.M.S. Titanic</p>
          <p><b>DDK</b> = R.M.S. Carpathia</p>
          <p><b>MPA</b> = R.M.S. Baltic</p>

          <div class="smallTitle">Q-CODES</div>
          <p><b>CQ</b> = an alle</p>
          <p><b>D</b> = distress / Notfall</p>
          <p><b>DE</b> = this is / hier ist</p>
          <p><b>?</b> = nicht verstanden</p>
          <p><b>.-.-.-</b> = Punkt</p>
        </aside>

      </div>
    </section>

    <section id="passedScreen" class="screen">
      <div class="paper centerPaper">
        <h1>PRÜFUNG BESTANDEN</h1>
        <p id="passedText"></p>
        <div class="morseStrip final">
          <div id="passwordMorse"></div>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
