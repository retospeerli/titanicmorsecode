<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titanic Funkprüfung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">

    <section id="startScreen" class="screen active">
      <div class="startBox">
        <h1>R.M.S. TITANIC</h1>
        <p>Sprache der Auftragskarten wählen:</p>

        <div class="buttonRow">
          <button onclick="selectLang('de')">Deutsch</button>
          <button onclick="selectLang('en')">English</button>
        </div>

        <p class="small">Morsetaste festlegen:</p>
        <button id="keyButton">Taste wählen</button>
        <p id="keyInfo">Noch keine Taste gewählt.</p>

        <button id="startButton" disabled>Prüfung starten</button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <video id="videoPlayer" playsinline controls></video>

      <div id="taskCard"></div>

      <div id="incomingStrip"></div>

      <div id="currentSymbolBox">
        <div>Aktuelles Zeichen:</div>
        <strong id="currentSymbol">–</strong>
      </div>

      <div id="hiddenInputInfo">
        Morse mit der gewählten Taste eingeben.  
        Lange Pause = nächster Buchstabe.
      </div>

      <button id="checkButton">Funkspruch senden</button>
      <button id="repeatButton">Antwort nochmals hören</button>

      <div id="feedback"></div>
    </section>

    <section id="passedScreen" class="screen">
      <div class="startBox">
        <h1>PRÜFUNG BESTANDEN</h1>
        <p id="passedText"></p>
        <div id="passwordMorse"></div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
