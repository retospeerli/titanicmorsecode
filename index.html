<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titanic Funkprüfung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-start">
  <main id="app">

    <section id="startScreen" class="screen active">
      <div id="startBox">
        <h1>R.M.S. TITANIC</h1>

        <p>Sprache / Language</p>
        <div class="buttonRow">
          <button id="langDeBtn">Deutsch</button>
          <button id="langEnBtn">English</button>
        </div>

        <p>Morsetaste wählen</p>
        <button id="chooseKeyBtn">Taste wählen</button>
        <p id="keyInfo">Morsetaste: Leertaste</p>

        <button id="startBtn">Prüfung starten</button>
      </div>
    </section>

    <section id="appScreen" class="screen">

      <div id="taskCard"></div>

      <div id="receivePanel">
        <p id="receiveInstruction"></p>
        <input id="receiveInput" type="text" autocomplete="off" spellcheck="false" />
        <button id="checkReceiveBtn">Prüfen</button>
        <button id="repeatReceiveBtn">Nochmals hören</button>
      </div>

      <div id="morseStrip"></div>

      <div id="currentSymbolBox">
        <div id="currentSymbolLabel">Aktuelles Zeichen</div>
        <strong id="currentSymbol">–</strong>
      </div>

      <div id="feedback"></div>

    </section>

    <section id="passedScreen" class="screen">
      <div id="passedBox">
        <h1>PRÜFUNG BESTANDEN</h1>
        <p id="passedText"></p>
        <div id="passwordMorse"></div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
